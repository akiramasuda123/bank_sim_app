{% extends 'base.html' %}
{% block content %}

<div class="card shadow-sm mt-4">
    <div class="card-body p-4">
        <h4 class="card-title text-center mb-4 fw-bold text-primary">ログイン</h4>
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">ユーザー名</label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="例: user1" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">パスワード</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mb-3">ログイン</button>
        </form>

        <hr class="my-4">

        <div class="text-center">
            <p class="text-muted small mb-2">まだアカウントをお持ちでない場合</p>
            <a href="{{ url_for('register') }}" class="btn btn-success w-100 fw-bold py-2">
                ＋ 新規アカウントを作成する（サインアップ）
            </a>
        </div>
    </div>
</div>

{% endblock %}
